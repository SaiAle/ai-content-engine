apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: content-engine
  labels:
    app.kubernetes.io/name: content-engine-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: content-engine
spec:
  type: ClusterIP
  selector:
    app: content-engine-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: api-service-external
  namespace: content-engine
  labels:
    app.kubernetes.io/name: content-engine-api
    app.kubernetes.io/component: api-external
    app.kubernetes.io/part-of: content-engine
  annotations:
    # On cloud providers this provisions a cloud load balancer.
    # Remove if using Ingress only.
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: content-engine-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
