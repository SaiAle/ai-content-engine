apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: content-engine-api-hpa
  namespace: content-engine
  labels:
    app.kubernetes.io/name: content-engine-api
    app.kubernetes.io/component: autoscaler
    app.kubernetes.io/part-of: content-engine
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: content-engine-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
        - type: Percent
          value: 100
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
      selectPolicy: Min
