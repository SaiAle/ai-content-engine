apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: content-engine

resources:
  # 1. Namespace first — everything else lands inside it
  - namespace.yaml
  # 2. Secrets and config — consumed by workloads
  - secrets.yaml
  - configmap.yaml
  # 3. Stateful backing services
  - postgres.yaml
  - redis.yaml
  # 4. Application workload
  - api-deployment.yaml
  - api-service.yaml
  # 5. Autoscaling — references the Deployment, must come after it
  - hpa.yaml
  # 6. Ingress — references the Service, must come after it
  - ingress.yaml

commonLabels:
  app.kubernetes.io/part-of: content-engine
  app.kubernetes.io/managed-by: kustomize
