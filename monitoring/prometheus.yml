global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    environment: production
    service: ai-content-engine

# Load alert rules
rule_files:
  - /etc/prometheus/alerts/*.yml

# Alertmanager configuration (wire up your Alertmanager endpoint here)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#             - alertmanager:9093

scrape_configs:

  # Scrape the FastAPI app (prometheus_fastapi_instrumentator + custom metrics)
  - job_name: ai_content_api
    static_configs:
      - targets:
          - api:8000
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
    metrics_path: /metrics
    scrape_interval: 30s
